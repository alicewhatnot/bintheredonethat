<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bin There Done That</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 500px;
            width: 100%;
        }

        #addPinForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            z-index: 1000;
        }

        #addPinForm label {
            display: block;
            margin-top: 10px;
        }

        #addPinForm button {
            margin-top: 15px;
        }

        #date {

        }
    </style>
</head>

<body>

    <h1>Bin There Done That</h1>

    <div id="map"></div>

    <div id="controls">
        <button onclick="startAddPin()" id="addPinButton">
            Add Pin
        </button>
    </div>


    <!-- Add Pin form -->

    <div id="addPinForm">

        <h2>Add Pin</h2>

        <label>
            Photo:
            <input type="file"
                   id="pinPhoto"
                   accept="image/*">
        </label>

        <br>

        <button onclick="addPin()">
            Add Pin
        </button>

        <button onclick="closeAddPin()">
            Cancel
        </button>

    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const bounds = [
            [56.30, -2.90],
            [56.38, -2.70]
        ];

        const map = L.map('map', {
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            minZoom: 14
        }).fitBounds(bounds);


        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);


        // Stores the location while creating a pin

        let pinLocation = null;


        // Start creating a pin

        function startAddPin() {

            // Ask the browser for the user's location

            map.locate({
                setView: false,
                enableHighAccuracy: true
            });

        }


        // Location successfully found

        map.on('locationfound', function(e) {

            // Store the coordinates

            pinLocation = e.latlng;

            // Show the Add Pin form

            document.getElementById("addPinForm").style.display = "block";

        });


        // Location failed

        map.on('locationerror', function(e) {

            alert("Could not find your location: " + e.message);

        });


        // Close the form

        function closeAddPin() {

            document.getElementById("addPinForm").style.display = "none";

            // Clear selected photo

            document.getElementById("pinPhoto").value = "";

            pinLocation = null;

        }


        // Create the pin

        function addPin() {

            if (pinLocation === null) {

                alert("Location not found.");

                return;

            }


            const photo =
                document.getElementById("pinPhoto").files[0];


            if (!photo) {

                alert("Please select a photo.");

                return;

            }


            // Get today's date

            const today = new Date();

            const date =
                String(today.getDate()).padStart(2, '0') + '/' +
                String(today.getMonth() + 1).padStart(2, '0') + '/' +
                String(today.getFullYear()).slice(-2);


            // Create temporary URL for the photo

            const photoURL =
                URL.createObjectURL(photo);


            // Create the marker

            const marker = L.marker(pinLocation)
                .addTo(map);


            // Create the popup

            const popup = `
                <div>
                    <img
                        src="${photoURL}"
                        style="width: 30rem; max-width: 100%;"
                    >
                    <p style="text-decoration: underline; margin-bottom: 0;">
                        ${date}
                    </p>
                </div>
            `;

            marker.bindPopup(popup, {
                maxWidth: 500
            });


            // Close the form

            closeAddPin();

        }

    </script>

</body>
</html>
