<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>Bin There Done That</h1>

    <div id="map"></div>

    <div id="locate">
        <button onclick="locateUser()" id="locateButton">
            Locate
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const bounds = [
            [56.30, -2.90],
            [56.38, -2.70]
        ];

        const map = L.map('map', {
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            minZoom: 14
        }).fitBounds(bounds);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);


        function locateUser() {
            map.locate({
                setView: true,
                maxZoom: 18
            });
        }


        map.on('locationfound', function(e) {
            L.marker(e.latlng)
                .addTo(map)
                .bindPopup("You are here!")
                .openPopup();
        });


        map.on('locationerror', function(e) {
            alert("Could not find your location: " + e.message);
        });
    </script>
</body>
</html>
